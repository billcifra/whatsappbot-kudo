{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<div class="tarjeta entrar">
  <h1>{{ negocio }}</h1>
  <p class="suave">Panel del equipo</p>
  {% if error %}<div class="aviso aviso-alerta">{{ error }}</div>{% endif %}
  <form method="post" action="/panel/entrar">
    <input type="hidden" name="csrf" value="{{ csrf_entrar }}">
    <label>Usuario <input name="usuario" value="{{ usuario or '' }}" autocomplete="username" required autofocus></label>
    <label>Contraseña <input name="clave" type="password" autocomplete="current-password" required></label>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
